[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asta"
version = "1.0.0"
description = "Autonomous Software Testing Platform - CLI-first, locally installed software testing application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "jsonschema>=4.22.0",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
    "schemathesis>=4.0.0",
    "requests>=2.32.3",
    "pytest>=8.2.0",
    "tomli>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/asta/asta"
Repository = "https://github.com/asta/asta"
Issues = "https://github.com/asta/asta/issues"

[project.scripts]
asta = "asta.cli:cli"
sta = "asta.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["asta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "C4", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.py$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''